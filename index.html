<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>Original 3D Aquatic Motion</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #050508;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }
    canvas {
      box-shadow: 0 0 35px rgba(255, 255, 255, 0.05);
      border-radius: 8px;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
</head>
<body>

<script>
let numParticles = 9000;
const LOOP_DURATION = Math.PI * 2; // 完美無縫循環週期

function setup() {
  createCanvas(600, 600);
  strokeWeight(1.2);
}

function draw() {
  background(5, 5, 8, 220); // 水下動態尾跡

  // 時間參數 t：全域 2*PI 週期
  let t = (frameCount * 0.015) % LOOP_DURATION;

  translate(width / 2, height / 2);

  for (let i = 0; i < numParticles; i++) {
    let u = i / numParticles; // 0.0 (魚頭) -> 1.0 (魚尾)

    // --- 動態創新 1：身體隨時間相位延遲，實現「跟隨頭部游動」的流體物理 ---
    let tLag = t - u * 1.8; // 軀幹位置滯後於頭部，形成波動

    // 脊椎 3D 八字形軌跡 (3D Lissajous Path)
    let spineX = Math.sin(tLag) * 140;
    let spineY = Math.sin(tLag * 2) * 70;
    let spineZ = Math.cos(tLag) * 110;

    // --- 動態創新 2：動態呼吸鰭片（轉彎展開、衝刺收攏） ---
    // 透過轉向加速度（tLag * 2 的微分感）影響鰭片寬度
    let finBreath = 1 + Math.cos(tLag * 2) * 0.35;
    
    let bodyWidth = 0;
    if (u < 0.25) {
      // 流線魚頭
      bodyWidth = Math.sin((u / 0.25) * (Math.PI / 2)) * 30;
    } else if (u < 0.65) {
      // 魚身與胸鰭
      bodyWidth = Math.cos(((u - 0.25) / 0.4) * (Math.PI / 2)) * 30;
    } else {
      // 大面積羽翼尾鰭
      let tailProgress = (u - 0.65) / 0.35;
      bodyWidth = (4 + Math.pow(tailProgress, 1.6) * 50) * finBreath;
    }

    // --- 環狀採樣與扭曲 ---
    let angle = u * Math.PI * 45 + t;
    let offsetX = Math.cos(angle) * bodyWidth * 0.8;
    let offsetY = Math.sin(angle) * bodyWidth * 0.4;
    let offsetZ = Math.sin(angle * 2) * bodyWidth * 0.3;

    // 結合三維空間座標
    let x3d = spineX + offsetX;
    let y3d = spineY + offsetY;
    let z3d = spineZ + offsetZ;

    // --- 3D 透視投影 ---
    let fov = 380;
    let cameraDist = 420;
    let scale = fov / (cameraDist + z3d);

    let x2d = x3d * scale;
    let y2d = y3d * scale;

    // 深度光效與色彩
    let alpha = map(z3d, -160, 160, 25, 255);
    let brightness = map(z3d, -160, 160, 80, 255);

    stroke(brightness * 0.9, brightness * 0.95, brightness + 15, alpha);
    point(x2d, y2d);
  }
}
</script>

</body>
</html>
