<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>Grayscale Deep-Sea Fluid Entity</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #030303;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }
    canvas {
      box-shadow: 0 0 60px rgba(255, 255, 255, 0.03);
      border-radius: 8px;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
</head>
<body>

<script>
let numParticles = 15000; // 升級至 15,000 個粒子，細節密度極高
const NUM_STRANDS = 120;   // 120 條高密度結構絲線
const LOOP_DURATION = Math.PI * 4; // 完美無縫循環週期

function setup() {
  createCanvas(650, 650);
}

function draw() {
  // 極致純黑背景與輕微殘影，營造流暢水流殘像
  background(3, 3, 3, 210);

  // 平滑時間變數 t
  let t = (frameCount * 0.01) % LOOP_DURATION;
  translate(width / 2, height / 2);

  // --- 全局浮游動態：模擬深海微重力的緩慢升降與三維漂浮 ---
  let floatY = Math.sin(t) * 25;                       // 上下浮沉
  let floatRoll = Math.sin(t * 0.5) * 0.5 + Math.cos(t * 0.25) * 0.2; // 緩慢滾轉
  let floatPitch = Math.cos(t * 0.5) * 0.35;           // 緩慢俯仰
  let globalYaw = -0.65;                              // 深海斜視角

  for (let i = 0; i < numParticles; i++) {
    let u = i / numParticles; // 0.0 (頭端傘頂) -> 1.0 (尾端觸鬚末梢)
    
    let strandId = i % NUM_STRANDS;
    let strandAngle = (strandId / NUM_STRANDS) * TWO_PI;

    // --- 1. 形態架構：三層複合生物構造 ---
    let bodyLength = 340;
    let xBase = (u - 0.38) * bodyLength;

    // 依據 u 的位置劃分：頂罩傘體、裙擺邊緣、後方細長觸鬚
    let mantleRadius = 0;
    let rippleAmplitude = 0;

    if (u < 0.45) {
      // 第一層：圓潤厚實的頭部傘體 (Mantle)
      let headProgress = u / 0.45;
      mantleRadius = Math.sin(headProgress * Math.PI) * 75;
      rippleAmplitude = Math.pow(headProgress, 2) * 12;
    } else if (u < 0.7) {
      // 第二層：大幅張開且褶皺劇烈的羽翼裙擺 (Folding Outer Skirt)
      let skirtProgress = (u - 0.45) / 0.25;
      mantleRadius = (75 - skirtProgress * 30) * (1 + Math.sin(strandAngle * 6) * 0.15);
      rippleAmplitude = 20 + skirtProgress * 25;
    } else {
      // 第三層：分裂延伸的深海長絲觸鬚 (Trailing Tendrils)
      let tailProgress = (u - 0.7) / 0.3;
      mantleRadius = (45 * (1 - tailProgress)) + Math.pow(tailProgress, 2.2) * 65;
      rippleAmplitude = 35 + tailProgress * 30;
    }

    // --- 2. 水下雙相正弦波干涉（創造如裙襬散開的平滑流體波動）---
    // 主游動推力波（相位沿身軀 u 向後傳遞）
    let primaryWave = Math.sin(t * 2 - u * Math.PI * 3.5 + strandAngle * 0.5);
    
    // 邊緣高頻波浪褶皺（產生多重絲褶感）
    let finRipples = Math.cos(strandAngle * 8 + t * 3 - u * Math.PI * 5) * rippleAmplitude;

    // 算算 3D 截面採樣點
    let radiusX = (mantleRadius + finRipples * 0.6) * Math.cos(strandAngle);
    let radiusY = (mantleRadius + finRipples * 0.6) * Math.sin(strandAngle) * 0.5; // Y 軸略呈橢圓扁平

    let x3d = xBase + Math.sin(strandAngle + t) * 8;
    let y3d = radiusY + primaryWave * 12 + floatY;
    let z3d = radiusX;

    // --- 3. 三維空間滾轉矩陣（計算浮游姿態） ---
    // Roll (X 軸)
    let y1 = y3d * Math.cos(floatRoll) - z3d * Math.sin(floatRoll);
    let z1 = y3d * Math.sin(floatRoll) + z3d * Math.cos(floatRoll);

    // Pitch (Z 軸)
    let x2 = x3d * Math.cos(floatPitch) - y1 * Math.sin(floatPitch);
    let y2 = x3d * Math.sin(floatPitch) + y1 * Math.cos(floatPitch);

    // Yaw (Y 軸)
    let xFinal = x2 * Math.cos(globalYaw) + z1 * Math.sin(globalYaw);
    let zFinal = -x2 * Math.sin(globalYaw) + z1 * Math.cos(globalYaw);

    // --- 4. 3D 透視投影 ---
    let fov = 400;
    let cameraDistance = 460;
    let scale = fov / (cameraDistance + zFinal);

    let x2d = xFinal * scale;
    let y2d = y2 * scale;

    // --- 5. 純粹灰階光影（Grayscale Aesthetics）---
    // 近處點呈現高亮純白，遠處半透明暗灰，營造深海透光感
    let depthBrightness = map(zFinal, -160, 160, 40, 255);
    let depthAlpha = map(zFinal, -160, 160, 20, 230);

    // 核心骨幹/脊椎與絲線邊緣的光彩區分
    if (strandId % 10 === 0 && u < 0.75) {
      // 亮白脊椎主骨
      strokeWeight(1.5);
      stroke(depthBrightness, depthAlpha);
    } else {
      // 柔和半透明羽翼褶膜
      strokeWeight(0.85);
      stroke(depthBrightness * 0.85, depthAlpha * 0.65);
    }

    point(x2d, y2d);
  }
}
</script>

</body>
</html>
