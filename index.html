<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>Ultra-Smooth Deep-Sea Fluid Entity</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #020202;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }
    canvas {
      box-shadow: 0 0 70px rgba(255, 255, 255, 0.02);
      border-radius: 8px;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
</head>
<body>

<script>
let numParticles = 16000; // 16,000 個粒子提供極細緻的動態綿密感
const NUM_STRANDS = 120;
const LOOP_DURATION = Math.PI * 4; // 完美無縫循環週期

function setup() {
  createCanvas(650, 650);
  frameRate(60);
}

function draw() {
  // 微調畫布半透明度 (170)，形成極為絲滑的流體動態拖尾與殘影 (Motion Blur)
  background(2, 2, 2, 170);

  // 縮小時間步進量 (0.0075)，讓每張影格間的位移更細膩平滑
  let t = (frameCount * 0.0075) % LOOP_DURATION;
  translate(width / 2, height / 2);

  // 全局三維流體微重力漂浮（全正弦平滑曲線，無突變）
  let floatY = Math.sin(t) * 30;
  let floatRoll = Math.sin(t * 0.5) * 0.45 + Math.cos(t * 0.25) * 0.15;
  let floatPitch = Math.cos(t * 0.5) * 0.3;
  let globalYaw = -0.65;

  for (let i = 0; i < numParticles; i++) {
    let u = i / numParticles; 
    let strandId = i % NUM_STRANDS;
    let strandAngle = (strandId / NUM_STRANDS) * TWO_PI;

    // --- 1. 全連續可導軀體輪廓（消弭身軀折角感）---
    let bodyLength = 360;
    let xBase = (u - 0.35) * bodyLength;

    // 高階指數包絡線：使頭部、外幔裙襬到尾端觸鬚轉換時的導數完全連續
    let mainEnv = Math.pow(Math.sin(u * Math.PI), 0.65) * Math.exp(-0.8 * u);
    let skirtSpread = Math.pow(u, 2.5) * 80;
    let mantleRadius = mainEnv * 130 + skirtSpread * (0.6 + Math.sin(strandAngle * 6) * 0.2);

    // --- 2. 多重動態流體波干涉（相位連續傳遞）---
    // 主推進波：由頭部向觸鬚平滑傳播
    let wavePhase = t * 2 - u * Math.PI * 3.8 + strandAngle * 0.4;
    let primaryWave = Math.sin(wavePhase);

    // 裙襬與觸鬚末端的柔和高頻波浪褶皺
    let rippleAmp = (20 + Math.pow(u, 1.8) * 45);
    let finRipples = Math.cos(strandAngle * 8 + t * 2.5 - u * Math.PI * 5) * rippleAmp;

    // 三維圓周採樣
    let radiusX = (mantleRadius + finRipples * 0.5) * Math.cos(strandAngle);
    let radiusY = (mantleRadius + finRipples * 0.5) * Math.sin(strandAngle) * 0.48;

    let x3d = xBase + Math.sin(strandAngle + t * 0.8) * 6;
    let y3d = radiusY + primaryWave * (10 + u * 20) + floatY;
    let z3d = radiusX;

    // --- 3. 三維姿態旋轉矩陣 ---
    // Roll (X 軸)
    let y1 = y3d * Math.cos(floatRoll) - z3d * Math.sin(floatRoll);
    let z1 = y3d * Math.sin(floatRoll) + z3d * Math.cos(floatRoll);

    // Pitch (Z 軸)
    let x2 = x3d * Math.cos(floatPitch) - y1 * Math.sin(floatPitch);
    let y2 = x3d * Math.sin(floatPitch) + y1 * Math.cos(floatPitch);

    // Yaw (Y 軸)
    let xFinal = x2 * Math.cos(globalYaw) + z1 * Math.sin(globalYaw);
    let zFinal = -x2 * Math.sin(globalYaw) + z1 * Math.cos(globalYaw);

    // --- 4. 3D 透視投影 ---
    let fov = 420;
    let cameraDistance = 470;
    let scale = fov / (cameraDistance + zFinal);

    let x2d = xFinal * scale;
    let y2d = y2 * scale;

    // --- 5. 絲滑灰階視覺質感（無縫深度映射）---
    let depthBrightness = map(zFinal, -180, 180, 35, 255);
    let depthAlpha = map(zFinal, -180, 180, 15, 220);

    if (strandId % 10 === 0 && u < 0.8) {
      strokeWeight(1.4);
      stroke(depthBrightness, depthAlpha);
    } else {
      strokeWeight(0.8);
      stroke(depthBrightness * 0.82, depthAlpha * 0.55);
    }

    point(x2d, y2d);
  }
}
</script>

</body>
</html>
