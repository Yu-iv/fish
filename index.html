<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>Anatomical Bioluminescent Fish - 3D Math Art</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #010204;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }
    canvas {
      box-shadow: 0 0 50px rgba(0, 0, 0, 0.95);
      border-radius: 8px;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
</head>
<body>

<script>
let numParticles = 12000;
const NUM_STRANDS = 90; // 90 條光纖骨幹，精細織出魚身與鰭片
const LOOP_DURATION = Math.PI * 4; // 無縫無限循環週期

function setup() {
  createCanvas(650, 650);
}

function draw() {
  background(1, 2, 4, 210); // 深海暗黑背景與微弱餘暉

  let t = (frameCount * 0.015) % LOOP_DURATION;
  translate(width / 2, height / 2);

  for (let i = 0; i < numParticles; i++) {
    // u: 從魚吻 (0.0) -> 魚頭 (0.15) -> 魚身 (0.5) -> 尾柄 (0.8) -> 尾鰭 (1.0)
    let u = i / numParticles; 
    
    let strandId = i % NUM_STRANDS;
    let strandAngle = (strandId / NUM_STRANDS) * TWO_PI;

    // --- 1. 魚體長度與主軸 ---
    let fishLength = 340;
    let xBase = (u - 0.35) * fishLength;

    // --- 2. 魚類輪廓半徑（側扁比例：高而窄） ---
    let headAndBody = 0;
    if (u < 0.15) {
      // 魚頭：從尖銳魚吻流線過渡至鰓蓋
      headAndBody = Math.sin((u / 0.15) * (Math.PI / 2)) * 42;
    } else if (u < 0.75) {
      // 魚身：厚實軀幹向尾柄漸細
      headAndBody = Math.cos(((u - 0.15) / 0.6) * (Math.PI / 2)) * 42;
    } else {
      // 尾柄極細
      headAndBody = 6;
    }

    let heightY = headAndBody;       // Y軸：魚身高度
    let thicknessZ = headAndBody * 0.35; // Z軸：魚身厚度（側面扁平）

    // --- 3. 專屬鰭片幾何結構（背鰭、胸鰭、雙叉尾鰭） ---
    let finOffsetY = 0;
    let finOffsetZ = 0;

    // A. 背鰭 (Dorsal Fin)：部位於脊背上方 (u: 0.3~0.65，向上延伸)
    if (u > 0.28 && u < 0.65 && Math.sin(strandAngle) > 0.5) {
      let dorsalShape = Math.sin(((u - 0.28) / 0.37) * Math.PI);
      finOffsetY -= dorsalShape * 35 * Math.pow(Math.sin(strandAngle), 2);
    }

    // B. 胸鰭 (Pectoral Fins)：部位於兩側 (u: 0.18~0.32，向兩側張開)
    if (u > 0.18 && u < 0.32 && Math.abs(Math.cos(strandAngle)) > 0.6) {
      let pectoralShape = Math.sin(((u - 0.18) / 0.14) * Math.PI);
      finOffsetZ += Math.sign(Math.cos(strandAngle)) * pectoralShape * 32;
    }

    // C. 雙叉尾鰭 (Caudal Fin)：尾端垂直大面積 V 型展開 (u: 0.78~1.0)
    if (u >= 0.78) {
      let tailProgress = (u - 0.78) / 0.22;
      // 上下分叉的幾何擴展
      let tailFork = Math.sin(tailProgress * Math.PI) * 65;
      if (Math.sin(strandAngle) > 0) {
        finOffsetY -= tailFork * 0.9;
      } else {
        finOffsetY += tailFork * 0.9;
      }
    }

    // 計算斷面環狀座標
    let yLocal = Math.sin(strandAngle) * heightY + finOffsetY;
    let zLocal = Math.cos(strandAngle) * thicknessZ + finOffsetZ;

    // --- 4. 真魚物理擺動 (Carangiform Propulsion Wave) ---
    // 擺幅由頭至尾呈指數級放大
    let waveAmplitude = 3 + Math.pow(u, 2.2) * 65;
    
    // 水阻滯後相角 (Hydrodynamic Lag)：尾鰭末端滯後於身體
    let tailLag = u > 0.78 ? (u - 0.78) * 1.5 : 0;
    let wavePhase = t * 2.5 - u * Math.PI * 3.8 - tailLag;

    let lateralSway = Math.sin(wavePhase) * waveAmplitude;

    // 三維維度結合
    let x3d = xBase;
    let y3d = yLocal;
    let z3d = zLocal + lateralSway;

    // --- 5. 3D 姿態與游泳航向（大角度傾斜與流暢迴旋） ---
    let pitch = Math.sin(t * 0.5) * 0.25;               // 俯仰
    let yaw = -0.65 + Math.sin(t * 0.25) * 0.15;         // 航向角
    let roll = Math.sin(t * 0.5 - u * 0.8) * 0.45;       // 側翻滾轉

    // 3D 矩陣旋轉
    // Roll (X軸)
    let y1 = y3d * Math.cos(roll) - z3d * Math.sin(roll);
    let z1 = y3d * Math.sin(roll) + z3d * Math.cos(roll);

    // Pitch (Z軸)
    let x2 = x3d * Math.cos(pitch) - y1 * Math.sin(pitch);
    let y2 = x3d * Math.sin(pitch) + y1 * Math.cos(pitch);

    // Yaw (Y軸)
    let xFinal = x2 * Math.cos(yaw) + z1 * Math.sin(yaw);
    let zFinal = -x2 * Math.sin(yaw) + z1 * Math.cos(yaw);

    // --- 6. 3D 透視投影 ---
    let fov = 420;
    let camDist = 480;
    let scale = fov / (camDist + zFinal);

    let x2d = xFinal * scale;
    let y2d = y2 * scale;

    // --- 7. 發光質感與點陣層次 ---
    let alpha = map(zFinal, -180, 180, 25, 255);
    let brightness = map(zFinal, -180, 180, 70, 255);

    // 魚脊與亮點高光，其餘鰭片保持輕盈透光
    if (Math.abs(strandAngle - Math.PI/2) < 0.2 || Math.abs(strandAngle + Math.PI/2) < 0.2) {
      strokeWeight(1.5);
      stroke(brightness, brightness + 25, 255, alpha);
    } else {
      strokeWeight(0.9);
      stroke(brightness * 0.8, brightness * 0.88, brightness + 15, alpha * 0.65);
    }

    point(x2d, y2d);
  }
}
</script>

</body>
</html>
