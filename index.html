<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>Organic 3D Math Sculpture</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #050505;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }
    canvas {
      box-shadow: 0 0 30px rgba(255, 255, 255, 0.05);
      border-radius: 8px;
    }
  </style>
  <!-- 引入 p5.js CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
</head>
<body>

<script>
let numParticles = 8000; // 點陣數量
let t = 0;
const LOOP_DURATION = Math.PI * 4; // 循環週期

function setup() {
  createCanvas(600, 600);
  strokeWeight(1.2);
}

function draw() {
  background(5, 5, 8, 220); // 帶微弱餘暉半透明背景，製造尾跡感

  // 計算無限完美的循環時間變數 t
  t = (frameCount * 0.015) % LOOP_DURATION;

  // 將座標原點移至畫布中心
  translate(width / 2, height / 2);

  for (let i = 0; i < numParticles; i++) {
    // 將 index 歸一化與參數化
    let u = i / numParticles; 
    let angle = u * TWO_PI * 12; // 基礎螺旋角度
    let layer = u * 20 - 10;     // 縱向分佈

    // 原創數學邏輯：雙頻率調變波與動態擺浪
    let wave1 = Math.sin(angle * 3 + t);
    let wave2 = Math.cos(layer * 1.5 - t * 2);
    let radius = 80 + wave1 * 35 + wave2 * 25 + Math.sin(t) * 15;

    // 算算出 3D 空間座標 (X, Y, Z)
    let x3d = radius * Math.cos(angle + Math.sin(t + layer * 0.2));
    let y3d = layer * 22 + Math.sin(angle * 2 + t) * 30;
    let z3d = radius * Math.sin(angle + Math.cos(t));

    // 全局動態傾斜與旋轉（實現完美無縫 Loop）
    let rotX = Math.sin(t * 0.5) * 0.4;
    let rotY = t * 0.5;

    // 3D 矩陣旋轉變換
    let yRot = y3d * Math.cos(rotX) - z3d * Math.sin(rotX);
    let zRot = y3d * Math.sin(rotX) + z3d * Math.cos(rotX);
    
    let xFinal = x3d * Math.cos(rotY) + zRot * Math.sin(rotY);
    let zFinal = -x3d * Math.sin(rotY) + zRot * Math.cos(rotY);

    // 3D 透視投影 (Perspective Projection)
    let fov = 350;
    let distance = 400;
    let scale = fov / (distance + zFinal);

    let x2d = xFinal * scale;
    let y2d = yRot * scale;

    // 根據深度 (Z 軸) 動態調整點的顏色與透明度，增強立體感
    let alpha = map(zFinal, -150, 150, 50, 255);
    let brightness = map(zFinal, -150, 150, 120, 255);
    
    stroke(brightness, brightness, brightness + 10, alpha);

    // 繪製點
    point(x2d, y2d);
  }
}
</script>

</body>
</html>
