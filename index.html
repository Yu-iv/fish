<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>High-Speed Grayscale Deep-Sea Entity</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #020202;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }
    canvas {
      box-shadow: 0 0 60px rgba(255, 255, 255, 0.04);
      border-radius: 8px;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
</head>
<body>

<script>
let numParticles = 15000; 
const NUM_STRANDS = 120;   
const LOOP_DURATION = Math.PI * 4; // 完美無縫循環週期

function setup() {
  createCanvas(650, 650);
}

function draw() {
  // 微幅調整餘暉（alpha = 190），既能消除動態拖影，又能保留極佳流暢感
  background(2, 2, 2, 190);

  // 1. 速度提升：時間步進提升至 0.025（流暢高頻動態）
  let t = (frameCount * 0.025) % LOOP_DURATION;
  translate(width / 2, height / 2);

  // 全局動態：結合 2.5x 速度的三維浮游與快速擺擺
  let floatY = Math.sin(t * 1.5) * 18;
  let floatRoll = Math.sin(t * 0.5) * 0.45;
  let floatPitch = Math.sin(t) * 0.25;
  let globalYaw = -0.62;

  for (let i = 0; i < numParticles; i++) {
    let u = i / numParticles; // 0.0 (頭端) -> 1.0 (尾端細絲)
    
    let strandId = i % NUM_STRANDS;
    let strandAngle = (strandId / NUM_STRANDS) * TWO_PI;

    // --- 三層複合生物幾何外形 ---
    let bodyLength = 340;
    let xBase = (u - 0.38) * bodyLength;

    let mantleRadius = 0;
    let rippleAmplitude = 0;

    if (u < 0.45) {
      // 傘體頭部
      let headProgress = u / 0.45;
      mantleRadius = Math.sin(headProgress * Math.PI) * 75;
      rippleAmplitude = Math.pow(headProgress, 2) * 10;
    } else if (u < 0.7) {
      // 廣闊羽翼褶裙
      let skirtProgress = (u - 0.45) / 0.25;
      mantleRadius = (75 - skirtProgress * 30) * (1 + Math.sin(strandAngle * 6) * 0.15);
      rippleAmplitude = 18 + skirtProgress * 28;
    } else {
      // 尾端拖曳長絲
      let tailProgress = (u - 0.7) / 0.3;
      mantleRadius = (45 * (1 - tailProgress)) + Math.pow(tailProgress, 2.2) * 65;
      rippleAmplitude = 32 + tailProgress * 35;
    }

    // --- 2. 融入第四個程式碼的核心波浪干涉機制 ---
    // A. 脊椎 S 型傳播波（從頭至尾加速度傳遞，擺幅隨 u 呈次方放大）
    let bodyFlex = Math.sin(t * 2.0 - u * Math.PI * 3.0) * (6 + Math.pow(u, 1.8) * 48);

    // B. 第四個程式碼特有的多頻率湍流（結合 3t 與 4e-4d 相位差公式）
    let highFreqTurbulence = Math.sin(strandAngle * 4 - u * Math.PI * 6 + t * 4.0) * rippleAmplitude;
    
    // C. 裙襬邊緣的二次細微顫動（高頻抖動感）
    let edgeFlutter = Math.cos(strandAngle * 8 + t * 3.0) * (rippleAmplitude * 0.35);

    // 截面幾何計算
    let totalRadius = mantleRadius + highFreqTurbulence * 0.5 + edgeFlutter;
    let radiusX = totalRadius * Math.cos(strandAngle);
    let radiusY = totalRadius * Math.sin(strandAngle) * 0.48;

    let x3d = xBase + Math.sin(strandAngle + t * 1.5) * 6;
    let y3d = radiusY + bodyFlex + floatY;
    let z3d = radiusX;

    // --- 3. 姿態矩陣旋轉 (Roll, Pitch, Yaw) ---
    let y1 = y3d * Math.cos(floatRoll) - z3d * Math.sin(floatRoll);
    let z1 = y3d * Math.sin(floatRoll) + z3d * Math.cos(floatRoll);

    let x2 = x3d * Math.cos(floatPitch) - y1 * Math.sin(floatPitch);
    let y2 = x3d * Math.sin(floatPitch) + y1 * Math.cos(floatPitch);

    let xFinal = x2 * Math.cos(globalYaw) + z1 * Math.sin(globalYaw);
    let zFinal = -x2 * Math.sin(globalYaw) + z1 * Math.cos(globalYaw);

    // --- 4. 3D 透視投影 ---
    let fov = 400;
    let cameraDistance = 460;
    let scale = fov / (cameraDistance + zFinal);

    let x2d = xFinal * scale;
    let y2d = y2 * scale;

    // --- 5. 灰階光彩與動態粒子畫筆 ---
    let depthBrightness = map(zFinal, -160, 160, 35, 255);
    let depthAlpha = map(zFinal, -160, 160, 15, 220);

    if (strandId % 10 === 0 && u < 0.75) {
      strokeWeight(1.4);
      stroke(depthBrightness, depthAlpha);
    } else {
      strokeWeight(0.8);
      stroke(depthBrightness * 0.82, depthAlpha * 0.6);
    }

    point(x2d, y2d);
  }
}
</script>

</body>
</html>
