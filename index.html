<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>Ultra-Smooth Grayscale Deep-Sea Entity</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #030303;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }
    canvas {
      box-shadow: 0 0 60px rgba(255, 255, 255, 0.04);
      border-radius: 8px;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
</head>
<body>

<script>
let numParticles = 15000;
let t = 0;
const LOOP_DURATION = Math.PI * 12; // 12*PI 完美無縫循環週期

function setup() {
  createCanvas(650, 650);
}

function draw() {
  // 純黑背景 + 絲滑殘影（繼承第四版的動態尾跡質感）
  background(3, 3, 3, 210);

  // 時間步進：採用第四版的 PI / 80 頻率，運行無比順暢
  t += PI / 80;
  let currentT = t % LOOP_DURATION;

  translate(width / 2, height / 2);

  for (let i = numParticles; i > 0; i--) {
    let y = i / 353; // 精準的採樣步進

    // --- 1. 複合深海生物包絡（傘頭 + 褶裙 + 長絲）---
    let headProfile = (y < 9 ? 9 : 5);
    let baseK = headProfile + Math.cos(y * 31 - currentT);
    let k = baseK * Math.cos(i / 44);
    let e = y / 9 - 14;

    // --- 2. 第四版極致流暢的核心：歐幾里得距離 d 與相位相干角 c ---
    let d = Math.hypot(k, e) / 1.6;
    let c = d - currentT / 2;

    // --- 3. 多頻率正弦疊加（構建 3D 深海空間體積）---
    let x3d = (d * 9.5 + k * k) * Math.cos(c);
    let y3d = (50 + d * 9.5) * Math.sin(c / 3) + 
              4 * Math.sin(k * 2) + 
              (y / 28) * k * (e + 3 * Math.sin(e * 4 - d * 4 + currentT * 3));
    let z3d = (d * 8 + k * k * 0.5) * Math.sin(c); // 強化 3D 深度感

    // 微幅深海斜角與輕量化姿態變換
    let rotX = 0.25 + Math.sin(currentT * 0.15) * 0.06;
    let rotY = -0.45 + Math.cos(currentT * 0.1) * 0.08;

    let yRot = y3d * Math.cos(rotX) - z3d * Math.sin(rotX);
    let zRot = y3d * Math.sin(rotX) + z3d * Math.cos(rotX);

    let xFinal = x3d * Math.cos(rotY) + zRot * Math.sin(rotY);
    let zFinal = -x3d * Math.sin(rotY) + zRot * Math.cos(rotY);

    // --- 4. 3D 透視投影 ---
    let fov = 420;
    let cameraDist = 450;
    let scale = fov / (cameraDist + zFinal);

    let x2d = xFinal * scale;
    let y2d = yRot * scale;

    // --- 5. 高對比純粹灰階階調（Monochrome Lighting）---
    let brightness = map(zFinal, -160, 160, 35, 255);
    let alpha = map(zFinal, -160, 160, 15, 220);

    // 主骨幹與柔和褶膜的線條分層
    if (i % 60 === 0) {
      strokeWeight(1.5);
      stroke(brightness, alpha);
    } else {
      strokeWeight(0.85);
      stroke(brightness * 0.85, alpha * 0.65);
    }

    point(x2d, y2d);
  }
}
</script>

</body>
</html>
