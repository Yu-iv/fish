<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>Dynamic Grayscale Deep-Sea Entity</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #030303;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }
    canvas {
      box-shadow: 0 0 60px rgba(255, 255, 255, 0.03);
      border-radius: 8px;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
</head>
<body>

<script>
let numParticles = 15000; // 保持 15,000 高密度點陣
const NUM_STRANDS = 120;   // 120 條極細纖維絲線
const LOOP_DURATION = Math.PI * 4; // 完美無縫循環週期

function setup() {
  createCanvas(650, 650);
}

function draw() {
  // 暗黑背景與水下殘影
  background(3, 3, 3, 210);

  // 1. 時間推進速度提速：由原本的 0.01 提升至 0.024，大幅增強動態感
  let t = (frameCount * 0.024) % LOOP_DURATION;
  translate(width / 2, height / 2);

  // 2. 融合第四個程式碼的大角度姿態變化（Roll, Pitch, Yaw 隨時間交織）
  let globalRoll = Math.sin(t * 0.5) * 0.9;             // 體軸大角度滾轉
  let globalPitch = Math.cos(t * 0.5) * 0.5;           // 俯仰角波動
  let globalYaw = -0.6 + Math.sin(t * 0.25) * 0.2;     // 航向動態擺動

  for (let i = 0; i < numParticles; i++) {
    let u = i / numParticles; // 0.0 (頭端) -> 1.0 (尾端觸鬚)
    
    let strandId = i % NUM_STRANDS;
    let strandAngle = (strandId / NUM_STRANDS) * TWO_PI;

    // --- 複合生物外型拓撲（傘體 -> 翼膜褶裙 -> 細長觸鬚）---
    let bodyLength = 340;
    let xBase = (u - 0.4) * bodyLength;

    let mantleRadius = 0;
    let rippleAmplitude = 0;

    if (u < 0.4) {
      // 傘體頭部
      let headProgress = u / 0.4;
      mantleRadius = Math.sin(headProgress * Math.PI) * 75;
      rippleAmplitude = Math.pow(headProgress, 2) * 15;
    } else if (u < 0.68) {
      // 雙向羽翼裙擺
      let skirtProgress = (u - 0.4) / 0.28;
      mantleRadius = (75 - skirtProgress * 25) * (1 + Math.sin(strandAngle * 6) * 0.15);
      rippleAmplitude = 22 + skirtProgress * 28;
    } else {
      // 尾部觸鬚
      let tailProgress = (u - 0.68) / 0.32;
      mantleRadius = (50 * (1 - tailProgress)) + Math.pow(tailProgress, 2.2) * 70;
      rippleAmplitude = 38 + tailProgress * 35;
    }

    // --- 3. 參考第四個程式碼：加速波浪傳播與擺幅遞增 ---
    // 行進波相位：頻率加倍 (t * 2.8)，擺動推力感顯著提升
    let wavePhase = t * 2.8 - u * Math.PI * 4 + strandAngle * 0.5;
    let waveSwing = Math.sin(wavePhase) * (8 + Math.pow(u, 1.8) * 40);

    // 裙擺邊緣的高頻率摺浪
    let finRipples = Math.cos(strandAngle * 8 + t * 3.5 - u * Math.PI * 5) * rippleAmplitude;

    // 計算 3D 截面採樣點
    let radiusX = (mantleRadius + finRipples * 0.6) * Math.cos(strandAngle);
    let radiusY = (mantleRadius + finRipples * 0.6) * Math.sin(strandAngle) * 0.5;

    let x3d = xBase + Math.sin(strandAngle + t * 2) * 8;
    let y3d = radiusY + waveSwing;
    let z3d = radiusX;

    // --- 4. 三維三軸矩陣旋轉（姿態變換） ---
    // 身軀沿長軸的扭轉 (局部 Roll 疊加全局 Roll)
    let localRoll = globalRoll + (u - 0.5) * 0.5;

    // Roll (X 軸)
    let y1 = y3d * Math.cos(localRoll) - z3d * Math.sin(localRoll);
    let z1 = y3d * Math.sin(localRoll) + z3d * Math.cos(localRoll);

    // Pitch (Z 軸)
    let x2 = x3d * Math.cos(globalPitch) - y1 * Math.sin(globalPitch);
    let y2 = x3d * Math.sin(globalPitch) + y1 * Math.cos(globalPitch);

    // Yaw (Y 軸)
    let xFinal = x2 * Math.cos(globalYaw) + z1 * Math.sin(globalYaw);
    let zFinal = -x2 * Math.sin(globalYaw) + z1 * Math.cos(globalYaw);

    // --- 5. 3D 透視投影 ---
    let fov = 400;
    let cameraDistance = 460;
    let scale = fov / (cameraDistance + zFinal);

    let x2d = xFinal * scale;
    let y2d = y2 * scale;

    // --- 6. 純粹灰階光影 ---
    let depthBrightness = map(zFinal, -160, 160, 35, 255);
    let depthAlpha = map(zFinal, -160, 160, 20, 230);

    if (strandId % 10 === 0 && u < 0.75) {
      strokeWeight(1.5);
      stroke(depthBrightness, depthAlpha);
    } else {
      strokeWeight(0.85);
      stroke(depthBrightness * 0.85, depthAlpha * 0.65);
    }

    point(x2d, y2d);
  }
}
</script>

</body>
</html>
