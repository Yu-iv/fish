<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>3D Mathematical Fish Swim Simulation</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #030305;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }
    canvas {
      box-shadow: 0 0 40px rgba(0, 0, 0, 0.8);
      border-radius: 8px;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
</head>
<body>

<script>
let numParticles = 9000;
const LOOP_CYCLES = 2; 
const LOOP_DURATION = Math.PI * 2 * LOOP_CYCLES;

function setup() {
  createCanvas(600, 600);
  strokeWeight(1.3);
}

function draw() {
  // 半透明背景，創造輕微的水下動態殘影
  background(3, 4, 7, 210);

  // 時間參數 t：確保完美無縫循環 (Seamless Loop)
  let t = (frameCount * 0.02) % LOOP_DURATION;

  translate(width / 2, height / 2);

  for (let i = 0; i < numParticles; i++) {
    // u 代表從魚頭 (0.0) 到魚尾 (1.0) 的縱向位置
    let u = i / numParticles; 
    let fishLength = 260;
    let x3d = (u - 0.4) * fishLength; // 主軸：魚頭在前方，魚尾在後方

    // --- 1. 魚類輪廓半徑函數 (Envelope Function) ---
    // 透過數學函數塑造魚頭、厚實身體、纖細尾柄與擴張尾鰭
    let bodyRadius = 0;
    if (u < 0.15) {
      // 魚頭：圓潤過渡
      bodyRadius = Math.sin((u / 0.15) * (Math.PI / 2)) * 32;
    } else if (u < 0.75) {
      // 魚身：厚實且漸細
      let bodyProgress = (u - 0.15) / 0.6;
      bodyRadius = Math.cos(bodyProgress * (Math.PI / 2)) * 32;
    } else {
      // 尾柄與尾鰭：先極細後展開
      let tailProgress = (u - 0.75) / 0.25;
      bodyRadius = 4 + Math.sin(tailProgress * Math.PI) * 28;
    }

    // --- 2. 魚游動的波浪傳遞 (Traveling Wave Mechanics) ---
    // 相位隨 u 增加而延遲，形成由頭向尾傳播的游動波
    let wavePhase = t * 2 - u * Math.PI * 3.5;
    
    // 尾部擺動幅度比頭部大（擺幅隨 u 增加）
    let swingAmplitude = 8 + Math.pow(u, 1.8) * 45;
    let lateralOffset = Math.sin(wavePhase) * swingAmplitude;

    // --- 3. 截面圓周與幾何細節（脊椎與鰭片感）---
    let angle = u * Math.PI * 80; // 沿身體軸線環繞的角度
    
    // Y 軸高度壓縮（魚類通常是扁平側寬的）
    let radiusY = bodyRadius * (0.8 + Math.sin(angle * 2) * 0.2);
    let radiusZ = bodyRadius * 0.45; // 側向較薄

    let y3d = Math.cos(angle) * radiusY;
    let z3d = Math.sin(angle) * radiusZ + lateralOffset; // 結合橫向擺動

    // --- 4. 魚體在水中前進與轉彎的姿態角 ---
    // 讓整個魚體順著游泳的波動進行小幅度的整體傾斜與旋轉
    let bodyPitch = Math.sin(t) * 0.15;                 // 上下俯仰
    let bodyYaw = Math.sin(t * 0.5) * 0.35 + (u - 0.5) * 0.2; // 左右轉向航向角

    // 進行三維旋轉變換 (Yaw & Pitch)
    // 1) Yaw 旋轉 (Y 軸)
    let xRot1 = x3d * Math.cos(bodyYaw) - z3d * Math.sin(bodyYaw);
    let zRot1 = x3d * Math.sin(bodyYaw) + z3d * Math.cos(bodyYaw);

    // 2) Pitch 旋轉 (Z 軸)
    let xRot2 = xRot1 * Math.cos(bodyPitch) - y3d * Math.sin(bodyPitch);
    let yRot2 = xRot1 * Math.sin(bodyPitch) + y3d * Math.cos(bodyPitch);

    // --- 5. 3D 透視投影 (Perspective Projection) ---
    let fov = 380;
    let cameraDist = 420;
    let scale = fov / (cameraDist + zRot1);

    let x2d = xRot2 * scale;
    let y2d = yRot2 * scale;

    // --- 6. 深度與動態光彩 ---
    // 根據 Z 軸與魚身位置調配光感，魚頭與魚背更亮
    let alpha = map(zRot1, -120, 120, 40, 255);
    let brightness = map(zRot1, -120, 120, 100, 255);

    // 微調點的顏色：魚背微藍，骨幹清晰
    stroke(brightness * 0.9, brightness * 0.95, brightness + 10, alpha);

    // 繪製頂點
    point(x2d, y2d);
  }
}
</script>

</body>
</html>
